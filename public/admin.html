<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OZERA — Адмін панель</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #232636;
    --border: #2e3250; --accent: #4f8ef7; --accent2: #3d6fd4;
    --text: #e8eaf6; --muted: #8891b2; --danger: #e55353;
    --success: #4caf7d; --warn: #f0a030;
    --radius: 8px; --radius-lg: 12px;
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; }

  /* LAYOUT */
  .app { display: flex; height: 100vh; overflow: hidden; }
  .sidebar { width: 280px; min-width: 280px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .main { flex: 1; overflow-y: auto; }

  /* SIDEBAR */
  .sidebar-header { padding: 20px 16px 12px; border-bottom: 1px solid var(--border); }
  .sidebar-header h1 { font-size: 18px; font-weight: 700; color: var(--accent); }
  .sidebar-header p { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .sidebar-search { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .sidebar-search input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; color: var(--text); font-size: 13px; outline: none; }
  .sidebar-search input:focus { border-color: var(--accent); }
  .sidebar-actions { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .btn-new { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 9px; cursor: pointer; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background .15s; }
  .btn-new:hover { background: var(--accent2); }
  .lake-list { flex: 1; overflow-y: auto; }
  .lake-list-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; display: flex; align-items: flex-start; gap: 10px; }
  .lake-list-item:hover { background: var(--surface2); }
  .lake-list-item.active { background: var(--surface2); border-left: 3px solid var(--accent); }
  .lake-thumb { width: 42px; height: 42px; border-radius: 6px; object-fit: cover; background: var(--surface2); flex-shrink: 0; border: 1px solid var(--border); }
  .lake-thumb-placeholder { width: 42px; height: 42px; border-radius: 6px; background: var(--surface2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 18px; border: 1px solid var(--border); }
  .lake-list-info { flex: 1; min-width: 0; }
  .lake-list-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lake-list-city { color: var(--muted); font-size: 11px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* MAIN CONTENT */
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--muted); gap: 12px; }
  .empty-state .icon { font-size: 48px; }

  /* EDITOR */
  .editor { padding: 24px; max-width: 900px; }
  .editor-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .editor-title { font-size: 20px; font-weight: 700; }
  .editor-actions { display: flex; gap: 8px; }
  .btn { border: none; border-radius: var(--radius); padding: 8px 16px; cursor: pointer; font-size: 13px; font-weight: 600; transition: opacity .15s; display: flex; align-items: center; gap: 6px; }
  .btn:hover { opacity: .85; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* SECTIONS */
  .section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 16px; overflow: hidden; }
  .section-header { padding: 14px 18px; display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; border-bottom: 1px solid transparent; transition: background .1s; }
  .section-header:hover { background: var(--surface2); }
  .section-header.open { border-bottom-color: var(--border); }
  .section-icon { font-size: 16px; }
  .section-title { font-weight: 600; font-size: 14px; flex: 1; }
  .section-chevron { color: var(--muted); font-size: 12px; transition: transform .2s; }
  .section-chevron.open { transform: rotate(180deg); }
  .section-body { padding: 18px; display: none; }
  .section-body.open { display: block; }

  /* FORM FIELDS */
  .form-row { display: grid; gap: 14px; margin-bottom: 14px; }
  .form-row.cols-2 { grid-template-columns: 1fr 1fr; }
  .form-row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .form-row.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .form-control { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 12px; color: var(--text); font-size: 13px; outline: none; transition: border-color .15s; width: 100%; font-family: inherit; }
  .form-control:focus { border-color: var(--accent); }
  textarea.form-control { resize: vertical; min-height: 90px; line-height: 1.5; }
  .toggle-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .toggle { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; cursor: pointer; inset: 0; background: var(--surface2); border: 1px solid var(--border); border-radius: 22px; transition: .2s; }
  .toggle-slider::before { content: ''; position: absolute; height: 16px; width: 16px; left: 2px; top: 2px; background: var(--muted); border-radius: 50%; transition: .2s; }
  .toggle input:checked + .toggle-slider { background: var(--accent); border-color: var(--accent); }
  .toggle input:checked + .toggle-slider::before { transform: translateX(18px); background: #fff; }
  .toggle-label { font-size: 13px; color: var(--text); }

  /* FISH TAGS */
  .tags-input-wrap { display: flex; flex-wrap: wrap; gap: 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; min-height: 44px; cursor: text; }
  .tags-input-wrap.focused { border-color: var(--accent); }
  .tag { background: var(--accent); color: #fff; border-radius: 4px; padding: 3px 8px; font-size: 12px; display: flex; align-items: center; gap: 4px; }
  .tag-remove { cursor: pointer; opacity: .7; font-size: 14px; line-height: 1; }
  .tag-remove:hover { opacity: 1; }
  .tag-input { border: none; outline: none; background: transparent; color: var(--text); font-size: 13px; min-width: 120px; flex: 1; }
  .fish-autocomplete { position: relative; }
  .fish-dropdown { position: absolute; z-index: 200; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); max-height: 210px; overflow-y: auto; min-width: 200px; display: none; box-shadow: 0 6px 20px rgba(0,0,0,.35); margin-top: 2px; }
  .fish-dropdown.show { display: block; }
  .fish-option { padding: 7px 12px; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
  .fish-option:hover { background: var(--surface2); }
  .fish-option .check { color: var(--success); font-size: 12px; }

  /* CONTACTS */
  .contacts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* IMAGES */
  .images-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .img-card { position: relative; width: 100px; height: 80px; border-radius: var(--radius); overflow: hidden; border: 2px solid var(--border); }
  .img-card img { width: 100%; height: 100%; object-fit: cover; }
  .img-card.primary { border-color: var(--accent); }
  .img-del { position: absolute; top: 3px; right: 3px; background: rgba(0,0,0,.7); color: #fff; border: none; border-radius: 4px; width: 20px; height: 20px; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; }
  .img-primary-badge { position: absolute; bottom: 3px; left: 3px; background: var(--accent); color: #fff; border-radius: 3px; font-size: 9px; padding: 1px 4px; font-weight: 700; }
  .upload-btn { background: var(--surface2); border: 2px dashed var(--border); border-radius: var(--radius); padding: 12px 18px; cursor: pointer; color: var(--muted); font-size: 13px; transition: border-color .15s; display: inline-flex; align-items: center; gap: 6px; }
  .upload-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* TOAST */
  .toast-wrap { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 1000; }
  .toast { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; font-size: 13px; display: flex; align-items: center; gap: 8px; animation: slideIn .2s ease; max-width: 320px; }
  .toast.success { border-color: var(--success); }
  .toast.error { border-color: var(--danger); }
  @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* LOADING */
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* MISC */
  .badge { display: inline-block; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px; font-size: 11px; color: var(--muted); }
  .divider { height: 1px; background: var(--border); margin: 14px 0; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* AI MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; }
  .modal-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .modal-header h2 { flex: 1; font-size: 17px; font-weight: 700; }
  .modal-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 4px; line-height: 1; }
  .modal-close:hover { color: var(--text); }
  .modal-body { padding: 20px 24px; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }
  .btn-ai { background: linear-gradient(135deg, #6366f1, #4f8ef7); color: #fff; }
  .btn-ai:hover { opacity: .9; }
  .ai-result-section { margin-top: 16px; }
  .ai-result-title { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: .5px; margin-bottom: 8px; }
  .ai-chip { display: inline-block; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; font-size: 12px; margin: 2px; color: var(--text); }
  .ai-chip.fish { border-color: #4f8ef7; color: #4f8ef7; }
  .ai-chip.amenity { border-color: var(--success); color: var(--success); }
  .ai-row { display: flex; gap: 8px; margin-bottom: 6px; font-size: 13px; }
  .ai-row-label { color: var(--muted); min-width: 120px; flex-shrink: 0; }
  .ai-row-value { color: var(--text); }
  .ai-cost { font-size: 12px; color: var(--muted); margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .ai-loading { text-align: center; padding: 32px 0; color: var(--muted); }
  .ai-spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: #6366f1; border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 12px; }
  .ai-sources { margin-top: 10px; }
  .ai-sources a { color: #4f8ef7; font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
  .ai-sources a:hover { text-decoration: underline; }

  /* AUTH SCREEN */
  .auth-screen { display: flex; align-items: center; justify-content: center; height: 100vh; background: var(--bg); }
  .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 48px 40px; text-align: center; max-width: 380px; width: 90%; }
  .auth-logo { font-size: 48px; margin-bottom: 16px; }
  .auth-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .auth-sub { color: var(--muted); font-size: 14px; margin-bottom: 32px; }
  .btn-google { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 12px 20px; background: #fff; color: #333; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; transition: box-shadow .2s; }
  .btn-google:hover { box-shadow: 0 4px 16px rgba(0,0,0,.3); }
  .auth-denied { margin-top: 20px; background: rgba(229,83,83,.1); border: 1px solid var(--danger); border-radius: var(--radius); padding: 14px; color: var(--danger); font-size: 13px; }
  /* USER INFO IN SIDEBAR */
  .user-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--border); margin-top: auto; }
  .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: var(--surface2); }
  .user-name { flex: 1; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn-logout { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); padding: 4px 8px; cursor: pointer; font-size: 11px; white-space: nowrap; }
  .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

  /* STRUCTURED MVP */
  .structured-note { background: rgba(79,142,247,.08); border: 1px solid rgba(79,142,247,.28); border-radius: var(--radius); padding: 10px 12px; color: var(--muted); font-size: 12px; line-height: 1.45; margin-bottom: 14px; }
  .structured-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .structured-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; }
  .structured-card-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
  .structured-mini { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.35; }
  .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
  .check-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 10px; display: flex; flex-direction: column; gap: 8px; min-height: 70px; }
  .check-main { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
  .check-main input, .inline-check input { width: 16px; height: 16px; accent-color: var(--accent); }
  .check-meta { display: grid; grid-template-columns: 1fr 82px; gap: 6px; align-items: center; }
  .check-meta label, .inline-check { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .mini-input { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 6px 7px; font-size: 12px; width: 100%; outline: none; }
  .mini-input:focus { border-color: var(--accent); }
  .tri-select { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 6px 7px; font-size: 12px; width: 100%; outline: none; }
  .pricing-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
  .pricing-table { width: 100%; min-width: 760px; border-collapse: collapse; background: var(--surface2); }
  .pricing-table th, .pricing-table td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 8px; vertical-align: top; }
  .pricing-table th { text-align: left; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .45px; background: rgba(0,0,0,.12); }
  .pricing-table tr:last-child td { border-bottom: none; }
  .pricing-table td:last-child, .pricing-table th:last-child { border-right: none; }
  .price-cell { display: grid; gap: 6px; min-width: 138px; }
  .rule-row { display: grid; grid-template-columns: minmax(220px, 1fr) 130px 130px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .rule-row:last-child { border-bottom: none; }
  .rule-label { font-size: 13px; font-weight: 600; }
  .rule-kind { font-size: 11px; color: var(--muted); }
  .verified-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }

  @media (max-width: 700px) {
    .form-row.cols-2, .form-row.cols-3, .form-row.cols-4 { grid-template-columns: 1fr; }
    .contacts-grid { grid-template-columns: 1fr; }
    .rule-row { grid-template-columns: 1fr; }
    .sidebar { width: 240px; min-width: 240px; }
  }
</style>
</head>
<body>
<div id="authWrapper"><!-- auth screen or app renders here --></div>
<div class="app" id="appShell" style="display:none">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>🎣 OZERA Admin</h1>
      <p id="lakeCount">Завантаження...</p>
    </div>
    <div class="sidebar-search">
      <input type="text" id="searchInput" placeholder="🔍 Пошук озера..." oninput="filterLakes()">
    </div>
    <div class="sidebar-actions">
      <button class="btn-new" onclick="createNew()">＋ Нове озеро</button>
    </div>
    <div class="lake-list" id="lakeList"></div>
    <div class="user-row" id="userRow"></div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="mainContent">
    <div class="empty-state">
      <div class="icon">🏞️</div>
      <div>Виберіть озеро зі списку або створіть нове</div>
    </div>
  </main>
</div>

<!-- TOAST -->
<div class="toast-wrap" id="toastWrap"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://hakinbhfivthqxvkssok.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhha2luYmhmaXZ0aHF4dmtzc29rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc4OTkwODksImV4cCI6MjA4MzQ3NTA4OX0.wS1nf7ymNbYZ1AlamiJiAPvcMAdcgIPBXrdpl4RxPzg';
const SUPABASE_SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhha2luYmhmaXZ0aHF4dmtzc29rIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2Nzg5OTA4OSwiZXhwIjoyMDgzNDc1MDg5fQ.ABINhHvWES-S-oSIdzxZa48V4X8o8-rcJK0GilljCRs';
const BUCKET = 'lake-images';

// sbAuth — для Google OAuth (anon key)
// sb — для операцій з даними (service key, минає RLS)
const sbAuth = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_SERVICE_KEY);

// ── STATE ────────────────────────────────────────────────────────────────
let lakes = [];
let currentLake = null;
let fishTags = [];
let currentUser = null;

// ── INIT / AUTH ──────────────────────────────────────────────────────────
async function init() {
  // Supabase обробляє OAuth redirect автоматично з URL хешу
  const { data: { session } } = await sbAuth.auth.getSession();

  if (!session) {
    showLoginScreen();
    return;
  }

  // Перевіряємо is_admin в таблиці profiles
  const { data: profile } = await sb.from('profiles').select('id, display_name, avatar_url, is_admin').eq('id', session.user.id).single();

  if (!profile?.is_admin) {
    showAccessDenied(session.user.email, profile?.display_name);
    return;
  }

  currentUser = { ...session.user, display_name: profile.display_name, avatar_url: profile.avatar_url };
  showApp();
  await loadLakes();
  renderUserRow();
}

function showLoginScreen() {
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('authWrapper').innerHTML = `
    <div class="auth-screen">
      <div class="auth-card">
        <div class="auth-logo">🎣</div>
        <div class="auth-title">OZERA Admin</div>
        <div class="auth-sub">Увійдіть щоб керувати озерами</div>

async function loginWithGoogle() {
  await sbAuth.auth.signInWithOAuth({
    provider: 'google',

function getAdminRedirectUrl() {
  return `${window.location.origin}${window.location.pathname}`;

async function logout() {
  await sbAuth.auth.signOut();

async function loadLakes() {
  const { data, error } = await sb.from('lakes').select('id, name, city, image_url').order('name');
  if (error) { toast('Помилка завантаження: ' + error.message, 'error'); return; }
  lakes = data || [];
  document.getElementById('lakeCount').textContent = `${lakes.length} озер`;
  renderList(lakes);
}

function renderList(list) {
  const el = document.getElementById('lakeList');
  el.innerHTML = list.map(l => `
    <div class="lake-list-item ${currentLake?.id === l.id ? 'active' : ''}" onclick="selectLake('${l.id}')">
      ${l.image_url
        ? `<img class="lake-thumb" src="${l.image_url}" onerror="this.style.display='none'">`
        : `<div class="lake-thumb-placeholder">🏞</div>`}
      <div class="lake-list-info">
        <div class="lake-list-name">${l.name}</div>
        <div class="lake-list-city">${l.city || '—'}</div>
      </div>
    </div>
  `).join('');
}

function filterLakes() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  renderList(lakes.filter(l => l.name.toLowerCase().includes(q) || (l.city||'').toLowerCase().includes(q)));
}

// ── SELECT LAKE ──────────────────────────────────────────────────────────
async function selectLake(id) {
  const { data, error } = await sb.from('lakes').select('*').eq('id', id).single();
  if (error) { toast('Помилка: ' + error.message, 'error'); return; }

  // Load images
  const { data: imgs } = await sb.from('lake_images').select('*').eq('lake_id', id).order('sort_order');

  currentLake = { ...data, _images: imgs || [] };
  renderEditor();
  document.querySelectorAll('.lake-list-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.lake-list-item').forEach(el => {
    if (el.onclick.toString().includes(id)) el.classList.add('active');
  });
}

function filterFishSuggestions() {
  const input = document.getElementById('tagInput');
  const dropdown = document.getElementById('fishDropdown');
  if (!dropdown) return;
  const q = (input.value || '').toLowerCase();
  const matches = q
    ? CANONICAL_FISH.filter(f => f.toLowerCase().includes(q))
    : CANONICAL_FISH;
  if (!matches.length) { dropdown.classList.remove('show'); return; }
  dropdown.innerHTML = matches.map(f => {
    const added = fishTags.some(t => t.toLowerCase() === f.toLowerCase());
    return `<div class="fish-option" onmousedown="selectFishSuggestion('${f}')">
      <span>${f}</span>${added ? '<span class="check">✓</span>' : ''}
    </div>`;
  }).join('');
  dropdown.classList.add('show');
}

function selectFishSuggestion(name) {
  if (!fishTags.some(t => t.toLowerCase() === name.toLowerCase())) {
    fishTags.push(name);
    renderTags();
  }
  const input = document.getElementById('tagInput');
  if (input) input.value = '';
  const dropdown = document.getElementById('fishDropdown');
  if (dropdown) { dropdown.classList.remove('show'); filterFishSuggestions(); }
}

// ── TAGS ──────────────────────────────────────────────────────────────────
function renderTags() {
  const wrap = document.getElementById('tagsWrap');
  if (!wrap) return;
  const input = document.getElementById('tagInput');
  wrap.innerHTML = '';
  fishTags.forEach((tag, i) => {
    const t = document.createElement('span');
    t.className = 'tag';
    t.innerHTML = `${esc(tag)} <span class="tag-remove" onclick="removeTag(${i})">×</span>`;
    wrap.appendChild(t);
  });
  wrap.appendChild(input);
}

function handleTagInput(e) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = e.target.value.trim().replace(/,$/, '');
    if (val && !fishTags.some(t => t.toLowerCase() === val.toLowerCase())) {
      fishTags.push(val);
      renderTags();
    }
    e.target.value = '';
    const dropdown = document.getElementById('fishDropdown');
    if (dropdown) dropdown.classList.remove('show');
  } else if (e.key === 'Backspace' && e.target.value === '' && fishTags.length) {
    fishTags.pop(); renderTags();
  }
}

function removeTag(i) { fishTags.splice(i, 1); renderTags(); }

function triValue(value) {
  if (value === true || value === 'true') return 'true';
  if (value === false || value === 'false') return 'false';
  return 'unknown';
}

function triSelectHtml(id, value, label = '') {
  return `

      <option value="unknown" ${triValue(value) === 'unknown' ? 'selected' : ''}>Не уточнено</option>
      <option value="true" ${triValue(value) === 'true' ? 'selected' : ''}>Є / дозволено</option>
      <option value="false" ${triValue(value) === 'false' ? 'selected' : ''}>Немає / заборонено</option>
    </select>
  `;
}

function parseTri(value) {
  if (value === 'true') return true;
  if (value === 'false') return false;
  return null;
}

function numOrNull(value) {
  const n = parseFloat(String(value || '').replace(',', '.'));

}

function safeKey(value) {
  return String(value).toLowerCase().replace(/[^a-zа-яіїєґ0-9]+/gi, '_');
}

function collectStructuredData() {
  const fish = {};
  document.querySelectorAll('.js-structured-fish').forEach(input => {
    const name = input.dataset.fish;
    const key = safeKey(name);
    fish[name] = {
      present: input.checked,
      trophy: document.getElementById(`sf_fish_trophy_${key}`)?.checked || false,
      releaseFromKg: document.getElementById(`sf_fish_release_${key}`)?.value.trim() || null,
    };
  });

  const pricing = {};
  PRICE_CATEGORIES.forEach(cat => {
    pricing[cat.key] = {};
    PRICE_PERIODS.forEach(period => {
      const id = `sf_price_${cat.key}_${period.key}`;
      pricing[cat.key][period.key] = {
        available: parseTri(document.getElementById(`${id}_available`)?.value),
        price: numOrNull(document.getElementById(`${id}_price`)?.value),
        note: document.getElementById(`${id}_note`)?.value.trim() || null,
      };
    });
  });

  const rules = {};
  RULE_DEFS.forEach(rule => {
    const raw = document.getElementById(`sf_rule_${rule.key}_value`)?.value;
    rules[rule.key] = {
      value: rule.type === 'number' ? numOrNull(raw) : parseTri(raw),
      note: document.getElementById(`sf_rule_${rule.key}_note`)?.value.trim() || null,
    };
  });

  const amenities = {};
  AMENITY_DEFS.forEach(a => {
    amenities[a.key] = {
      label: a.label,
      available: document.getElementById(`sf_amenity_${a.key}`)?.checked || false,
      note: document.getElementById(`sf_amenity_${a.key}_note`)?.value.trim() || null,
    };
  });

  const completion = {};
  ['basic','fish','pricing','quota','schedule','stocking','rules','photos','called'].forEach(key => {
    completion[key] = document.getElementById(`sf_completion_${key}`)?.checked || false;
  });

  return {
    version: 1,
    fish,
    pricing,
    catchQuota: {
      totalKg: numOrNull(document.getElementById('sf_quota_total')?.value),
      peacefulKg: numOrNull(document.getElementById('sf_quota_peaceful')?.value),
      predatorKg: numOrNull(document.getElementById('sf_quota_predator')?.value),
      overLimitPriceUah: numOrNull(document.getElementById('sf_quota_overprice')?.value),
      trophyReleaseFromKg: numOrNull(document.getElementById('sf_quota_trophy')?.value),
      catchAndRelease: parseTri(document.getElementById('sf_quota_cnr')?.value),
      note: document.getElementById('sf_quota_note')?.value.trim() || null,
    },
    schedule: {
      is24h: document.getElementById('sf_schedule_24h')?.checked || false,
      bookingRequired: document.getElementById('sf_schedule_booking')?.checked || false,
      seasonal: document.getElementById('sf_schedule_seasonal')?.checked || false,
      winterFishing: parseTri(document.getElementById('sf_schedule_winter')?.value),
      nightFishing: parseTri(document.getElementById('sf_schedule_night')?.value),
      nightStart: document.getElementById('sf_schedule_night_start')?.value || null,
      nightEnd: document.getElementById('sf_schedule_night_end')?.value || null,
      checkInFrom: document.getElementById('sf_schedule_checkin')?.value || null,
      checkOutUntil: document.getElementById('sf_schedule_checkout')?.value || null,
      note: document.getElementById('sf_schedule_note')?.value.trim() || null,
    },
    stocking: {
      status: parseTri(document.getElementById('sf_stocking_status')?.value),
      frequency: document.getElementById('sf_stocking_frequency')?.value || 'unknown',
      lastDate: document.getElementById('sf_stocking_last_date')?.value || null,
      lastSpecies: (document.getElementById('sf_stocking_species')?.value || '').split(',').map(s => s.trim()).filter(Boolean),
      lastAmount: document.getElementById('sf_stocking_last_amount')?.value.trim() || null,
      note: document.getElementById('sf_stocking_note')?.value.trim() || null,

    rules,
    amenities,
    verified: {
      source: document.getElementById('sf_verified_source')?.value || null,
      lastVerifiedAt: document.getElementById('sf_verified_date')?.value || null,

function renderImages() {
  const grid = document.getElementById('imagesGrid');
  if (!grid || !currentLake._images) return;
  grid.innerHTML = currentLake._images.map((img, i) => `
    <div class="img-card ${i === 0 ? 'primary' : ''}">
      <img src="${img.url}" alt="">
      <button class="img-del" onclick="deleteImage('${img.id}', '${img.storage_path || ''}')">✕</button>
      ${i === 0 ? '<div class="img-primary-badge">ГОЛОВНЕ</div>' : ''}
    </div>
  `).join('');
}

async function uploadImages(input) {
  if (!currentLake?.id) { toast('Спочатку збережіть озеро', 'error'); return; }
  const files = Array.from(input.files);
  toast(`Завантаження ${files.length} фото...`);
  for (const file of files) {
    const ext = file.name.split('.').pop();
    const path = `${currentLake.id}/upload_${Date.now()}.${ext}`;
    const { error: upErr } = await sb.storage.from(BUCKET).upload(path, file, { upsert: true });
    if (upErr) { toast('Помилка upload: ' + upErr.message, 'error'); continue; }
    const { data: urlData } = sb.storage.from(BUCKET).getPublicUrl(path);
    const sortOrder = currentLake._images.length;
    const { data: row } = await sb.from('lake_images').insert({ lake_id: currentLake.id, url: urlData.publicUrl, storage_path: path, sort_order: sortOrder }).select().single();
    if (row) { currentLake._images.push(row); }
    if (sortOrder === 0) { await sb.from('lakes').update({ image_url: urlData.publicUrl }).eq('id', currentLake.id); currentLake.image_url = urlData.publicUrl; }
  }
  renderImages();
  toast(`✓ ${files.length} фото завантажено`, 'success');
  input.value = '';
}

async function deleteImage(imgId, storagePath) {
  if (!confirm('Видалити це фото?')) return;
  await sb.from('lake_images').delete().eq('id', imgId);
  if (storagePath) await sb.storage.from(BUCKET).remove([storagePath]);
  currentLake._images = currentLake._images.filter(i => i.id !== imgId);
  // Update primary image_url
  if (currentLake._images.length > 0) {
    await sb.from('lakes').update({ image_url: currentLake._images[0].url }).eq('id', currentLake.id);
  } else {
    await sb.from('lakes').update({ image_url: null }).eq('id', currentLake.id);
  }
  renderImages();
  toast('Фото видалено');
}

  const phones = (document.getElementById('f_contacts_phone')?.value || '').split(',').map(p => p.trim()).filter(Boolean);

  const structuredData = collectStructuredData();
  const payload = {
    name: document.getElementById('f_name').value.trim(),
    description: document.getElementById('f_description').value.trim(),
    city: document.getElementById('f_city').value.trim(),
    location_text: document.getElementById('f_location_text').value.trim(),
    lat: parseFloat(document.getElementById('f_lat').value) || null,
    lng: parseFloat(document.getElementById('f_lng').value) || null,
    area_ha: parseFloat(document.getElementById('f_area_ha').value) || null,
    max_depth_m: parseFloat(document.getElementById('f_max_depth_m').value) || null,
    location_google_url: document.getElementById('f_location_google_url').value.trim() || null,
    location_waze_url: document.getElementById('f_location_waze_url').value.trim() || null,
    scheme_enabled: document.getElementById('f_scheme_enabled').checked,
    scheme_image_url: document.getElementById('f_scheme_image_url').value.trim() || null,
    fish_species: getStructuredFishSpecies(),
    show_work_schedule: document.getElementById('f_show_work_schedule').checked,
    base_open_time: document.getElementById('f_base_open_time').value || null,
    base_close_time: document.getElementById('f_base_close_time').value || null,
    work_schedule_summary: document.getElementById('f_work_schedule_summary').value.trim() || null,
    price_details_text: document.getElementById('f_price_details_text').value.trim() || null,
    price_details_enabled: document.getElementById('f_price_details_enabled').checked,
    catch_quota_text: document.getElementById('f_catch_quota_text').value.trim() || null,
    catch_quota_enabled: document.getElementById('f_catch_quota_enabled').checked,
    additional_services_text: document.getElementById('f_additional_services_text').value.trim() || null,
    additional_services_enabled: document.getElementById('f_additional_services_enabled').checked,
    lake_rules_text: document.getElementById('f_lake_rules_text').value.trim() || null,
    lake_rules_enabled: document.getElementById('f_lake_rules_enabled').checked,
    stocking_text: document.getElementById('f_stocking_text').value.trim() || null,
    stocking_enabled: document.getElementById('f_stocking_enabled').checked,
    contacts: {
      phone: phones,
      email: document.getElementById('f_contacts_email').value.trim() || null,
      telegram: document.getElementById('f_contacts_telegram').value.trim() || null,
      instagram: document.getElementById('f_contacts_instagram').value.trim() || null,
      viber: document.getElementById('f_contacts_viber').value.trim() || null,
      website: document.getElementById('f_contacts_website').value.trim() || null,
    },
    contacts_enabled: document.getElementById('f_contacts_enabled').checked,
    extra: mergeStructuredExtra(currentLake.extra, structuredData),
  };

  if (!payload.name) { toast('Введіть назву озера', 'error'); btn.disabled = false; btn.innerHTML = '💾 Зберегти'; return; }

  let error;
  if (currentLake.id) {
    ({ error } = await sb.from('lakes').update(payload).eq('id', currentLake.id));
  } else {
    const { data, error: err } = await sb.from('lakes').insert(payload).select().single();
    error = err;
    if (data) currentLake.id = data.id;
  }

  btn.disabled = false;
  btn.innerHTML = '💾 Зберегти';

  if (error) { toast('Помилка: ' + error.message, 'error'); return; }

  currentLake = { ...currentLake, ...payload };
  toast('✓ Збережено!', 'success');
  await loadLakes();
  document.querySelectorAll('.lake-list-item').forEach(el => {
    if (el.onclick?.toString().includes(currentLake.id)) el.classList.add('active');
  });
}

// ── DELETE ───────────────────────────────────────────────────────────────
async function deleteLake() {
  if (!confirm(`Видалити озеро "${currentLake.name}"?\nЦя дія незворотна!`)) return;
  const { error } = await sb.from('lakes').delete().eq('id', currentLake.id);
  if (error) { toast('Помилка: ' + error.message, 'error'); return; }
  toast('Озеро видалено');
  currentLake = null;
  document.getElementById('mainContent').innerHTML = `<div class="empty-state"><div class="icon">🏞️</div><div>Виберіть озеро або створіть нове</div></div>`;
  await loadLakes();
}

// ── HELPERS ───────────────────────────────────────────────────────────────
function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toast(msg, type = '') {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `${type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️'} ${msg}`;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

init();

// ── AI MODAL ──────────────────────────────────────────────────────────────
const AI_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/ai-lake-search`;
const URL_FILL_API = '/api/admin/fill-from-url';
let aiData = null;

function openAiModal() {
  const lakeName = document.getElementById('f_name')?.value?.trim() || '';
  const lakeCity = document.getElementById('f_city')?.value?.trim() || '';

  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay" id="aiModal" onclick="closeAiModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <span style="font-size:20px">🤖</span>
          <h2>AI — Автозаповнення</h2>
          <button class="modal-close" onclick="closeAiModal()">×</button>
        </div>
        <div class="modal-body">
          <div class="form-group" style="margin-bottom:12px">
            <label>Назва озера</label>
            <input class="form-control" id="ai_lake_name" value="${esc(lakeName)}" placeholder="Введіть назву озера">
          </div>
          <div class="form-group">
            <label>Регіон (необов'язково)</label>
            <input class="form-control" id="ai_region" value="${esc(lakeCity)}" placeholder="Наприклад: Київська область">
          </div>
          <div class="form-group" style="margin-top:12px">
            <label>URL джерела</label>
            <input class="form-control" id="ai_source_url" placeholder="https://www.avanfish.com/about">
            <div style="margin-top:6px;font-size:12px;color:var(--muted)">
              Якщо вкажеш сторінку, я спробую витягнути дані прямо з неї і заповнити форму.
            </div>
          </div>
          <div style="margin-top:10px;font-size:12px;color:var(--muted)">
            Claude виконає до 8 веб-пошуків (~40 сек) і заповнить всі поля автоматично.
          </div>
          <div id="aiResultArea"></div>
        </div>
        <div class="modal-footer" id="aiFooter">
          <button class="btn btn-secondary" onclick="closeAiModal()">Скасувати</button>
          <button class="btn btn-ai" id="aiUrlBtn" onclick="runAiSearchUrl()">📎 З URL</button>
          <button class="btn btn-ai" id="aiSearchBtn" onclick="runAiSearch()">🔍 Шукати</button>
        </div>
      </div>
    </div>
  `);

  document.getElementById('ai_lake_name').focus();
  document.getElementById('ai_lake_name').addEventListener('keydown', e => {
    if (e.key === 'Enter') runAiSearch();
  });
}

function closeAiModal(event) {
  if (event && event.target !== document.getElementById('aiModal')) return;
  document.getElementById('aiModal')?.remove();
  aiData = null;
}

async function runAiSearch() {
  const lakeName = document.getElementById('ai_lake_name').value.trim();
  const region   = document.getElementById('ai_region').value.trim();

  if (!lakeName) {
    document.getElementById('ai_lake_name').focus();
    return;
  }

  // Показуємо лоадер
  document.getElementById('aiSearchBtn').disabled = true;
  document.getElementById('aiResultArea').innerHTML = `
    <div class="ai-loading">
      <div class="ai-spinner"></div>
      <div><strong>Шукаю інформацію...</strong></div>
      <div style="margin-top:6px;font-size:12px">Claude переглядає сайти, соцмережі, карти</div>
    </div>
  `;
  document.getElementById('aiFooter').innerHTML = `
    <div style="font-size:12px;color:var(--muted);margin:auto 0">Зачекайте ~40 секунд...</div>
  `;

  try {
    const res = await fetch(AI_FUNCTION_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      },
      body: JSON.stringify({ lake_name: lakeName, region: region || undefined }),
    });

    const json = await res.json();
    if (!json.ok || !json.data) throw new Error(json.error || 'Помилка сервера');

    aiData = json.data;
    renderAiResult(aiData);

  } catch (err) {
    document.getElementById('aiResultArea').innerHTML = `
      <div style="margin-top:16px;background:rgba(229,83,83,.1);border:1px solid var(--danger);border-radius:8px;padding:14px;color:var(--danger);font-size:13px">
        ❌ <strong>Помилка:</strong> ${err.message}<br>
        <span style="font-size:11px;margin-top:4px;display:block;color:var(--muted)">
          Переконайся що Edge Function задеплоєна і ANTHROPIC_API_KEY встановлено у Supabase Secrets.
        </span>
      </div>
    `;
    document.getElementById('aiFooter').innerHTML = `
      <button class="btn btn-secondary" onclick="closeAiModal()">Закрити</button>
      <button class="btn btn-ai" onclick="runAiSearch()">🔄 Спробувати знову</button>
    `;
  }
}

async function runAiSearchUrl() {
  const lakeName = document.getElementById('ai_lake_name').value.trim();
  const sourceUrl = document.getElementById('ai_source_url').value.trim();

  if (!sourceUrl) {
    document.getElementById('ai_source_url').focus();
    return;
  }

  const urlBtn = document.getElementById('aiUrlBtn');
  const searchBtn = document.getElementById('aiSearchBtn');
  if (urlBtn) urlBtn.disabled = true;
  if (searchBtn) searchBtn.disabled = true;

  document.getElementById('aiResultArea').innerHTML = `
    <div class="ai-loading">
      <div class="ai-spinner"></div>
      <div><strong>Читаю сторінку...</strong></div>
      <div style="margin-top:6px;font-size:12px">Парсер аналізує публічний сайт і формує чернетку для форми</div>
    </div>
  `;
  document.getElementById('aiFooter').innerHTML = `
    <div style="font-size:12px;color:var(--muted);margin:auto 0">Зачекайте кілька секунд...</div>
  `;

  try {
    const res = await fetch(URL_FILL_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: sourceUrl, lake_name: lakeName || undefined }),
    });

    const json = await res.json();
    if (!json.ok || !json.data) throw new Error(json.error || 'Помилка сервера');

    aiData = json.data;
    renderAiResult(aiData);
  } catch (err) {
    document.getElementById('aiResultArea').innerHTML = `
      <div style="margin-top:16px;background:rgba(229,83,83,.1);border:1px solid var(--danger);border-radius:8px;padding:14px;color:var(--danger);font-size:13px">
        ❌ <strong>Помилка:</strong> ${err.message}<br>
        <span style="font-size:11px;margin-top:4px;display:block;color:var(--muted)">
          Перевір, що URL публічний і доступний без авторизації.
        </span>
      </div>
    `;
    document.getElementById('aiFooter').innerHTML = `
      <button class="btn btn-secondary" onclick="closeAiModal()">Закрити</button>
      <button class="btn btn-ai" onclick="runAiSearchUrl()">🔄 Спробувати знову</button>
    `;
  } finally {
    if (urlBtn) urlBtn.disabled = false;
    if (searchBtn) searchBtn.disabled = false;
  }
}

function applyStructuredAiData(structured) {
  const setVal = (id, val) => { const el = document.getElementById(id); if (el && val != null && val !== '') el.value = val; };
  const setChk = (id, val) => { const el = document.getElementById(id); if (el && val != null) el.checked = !!val; };
  const setTri = (id, val) => { const el = document.getElementById(id); if (el && val != null) el.value = val === true ? 'true' : val === false ? 'false' : 'unknown'; };
  const escFish = (name) => CSS.escape(name);

  Object.entries(structured.fish || {}).forEach(([name, row]) => {
    const key = safeKey(name);
    const check = document.querySelector(`.js-structured-fish[data-fish="${escFish(name)}"]`);
    if (check) check.checked = !!row.present;
    const trophy = document.getElementById(`sf_fish_trophy_${key}`);
    if (trophy) trophy.checked = !!row.trophy;
    const rel = document.getElementById(`sf_fish_release_${key}`);
    if (rel) rel.value = row.releaseFromKg ?? '';
  });

  Object.entries(structured.pricing || {}).forEach(([catKey, periods]) => {
    Object.entries(periods || {}).forEach(([periodKey, cell]) => {
      const id = `sf_price_${catKey}_${periodKey}`;
      setTri(`${id}_available`, cell?.available);
      setVal(`${id}_price`, cell?.price);
      setVal(`${id}_note`, cell?.note);
    });
  });

  const quota = structured.catchQuota || {};
  setVal('sf_quota_total', quota.totalKg);
  setVal('sf_quota_peaceful', quota.peacefulKg);
  setVal('sf_quota_predator', quota.predatorKg);
  setVal('sf_quota_overprice', quota.overLimitPriceUah);
  setVal('sf_quota_trophy', quota.trophyReleaseFromKg);
  setTri('sf_quota_cnr', quota.catchAndRelease);
  setVal('sf_quota_note', quota.note);

  const schedule = structured.schedule || {};
  setChk('sf_schedule_24h', schedule.is24h);
  setChk('sf_schedule_booking', schedule.bookingRequired);
  setChk('sf_schedule_seasonal', schedule.seasonal);
  setTri('sf_schedule_winter', schedule.winterFishing);
  setTri('sf_schedule_night', schedule.nightFishing);
  setVal('sf_schedule_night_start', schedule.nightStart);
  setVal('sf_schedule_night_end', schedule.nightEnd);
  setVal('sf_schedule_checkin', schedule.checkInFrom);
  setVal('sf_schedule_checkout', schedule.checkOutUntil);
  setVal('sf_schedule_note', schedule.note);

  const stocking = structured.stocking || {};
  setTri('sf_stocking_status', stocking.status);
  setVal('sf_stocking_frequency', stocking.frequency);
  setVal('sf_stocking_last_date', stocking.lastDate);
  setVal('sf_stocking_species', Array.isArray(stocking.lastSpecies) ? stocking.lastSpecies.join(', ') : '');
  setVal('sf_stocking_last_amount', stocking.lastAmount);
  setVal('sf_stocking_note', stocking.note);

  Object.entries(structured.rules || {}).forEach(([key, row]) => {
    setTri(`sf_rule_${key}_value`, row?.value);
    setVal(`sf_rule_${key}_note`, row?.note);
  });

  Object.entries(structured.amenities || {}).forEach(([key, row]) => {
    setChk(`sf_amenity_${key}`, row?.available);
    setVal(`sf_amenity_${key}_note`, row?.note);
  });

  const verified = structured.verified || {};
  setVal('sf_verified_source', verified.source);
  setVal('sf_verified_date', verified.lastVerifiedAt);
  setVal('sf_verified_note', verified.internalNote);
  const completion = verified.completion || {};
  ['basic','fish','pricing','quota','schedule','stocking','rules','photos','called'].forEach((key) => {
    setChk(`sf_completion_${key}`, completion[key]);
  });
}

function renderAiResult(d) {
  const meta = d._meta || {};
  const fish = (d.fish_species || []).map(f => `<span class="ai-chip fish">🐟 ${f}</span>`).join('');
  const amenities = (d.amenities || []).map(a => `<span class="ai-chip amenity">✅ ${a.label}</span>`).join('');
  const c = d.contacts || {};
  const structured = d.structured || null;
  const sources = (d.sources || []).map(s => `<a href="${s}" target="_blank">${s}</a>`).join('');

  document.getElementById('aiResultArea').innerHTML = `
    <div class="ai-result-section" style="margin-top:20px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:16px">

      <div class="ai-result-title">✅ Знайдено</div>

      <div class="ai-row"><span class="ai-row-label">📍 Назва</span><span class="ai-row-value">${esc(d.name || '—')}</span></div>
      <div class="ai-row"><span class="ai-row-label">🗺️ Адреса</span><span class="ai-row-value">${esc(d.location_text || '—')}</span></div>
      <div class="ai-row"><span class="ai-row-label">📐 Координати</span><span class="ai-row-value">${d.lat && d.lng ? `${d.lat}, ${d.lng}` : '—'}</span></div>
      <div class="ai-row"><span class="ai-row-label">📏 Площа / Глибина</span><span class="ai-row-value">${d.area_ha ? d.area_ha + ' га' : '—'} / ${d.max_depth_m ? d.max_depth_m + ' м' : '—'}</span></div>
      <div class="ai-row"><span class="ai-row-label">⏰ Режим роботи</span><span class="ai-row-value">${esc(d.work_schedule_summary || '—')}</span></div>
      <div class="ai-row"><span class="ai-row-label">📱 Телефон</span><span class="ai-row-value">${esc(c.phone || '—')}</span></div>

      <div style="margin:10px 0 4px"><span class="ai-row-label" style="font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted)">🐟 Риба</span></div>
      <div>${fish || '<span style="color:var(--muted);font-size:12px">не знайдено</span>'}</div>

      <div style="margin:10px 0 4px"><span class="ai-row-label" style="font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted)">🏕️ Зручності</span></div>
      <div>${amenities || '<span style="color:var(--muted);font-size:12px">не знайдено</span>'}</div>

      ${sources ? `<div class="ai-sources" style="margin-top:10px"><div class="ai-result-title">📎 Джерела</div>${sources}</div>` : ''}

      <div class="ai-cost">
        🔎 ${meta.web_searches || 0} пошуків &nbsp;·&nbsp;
        💸 $${meta.estimated_cost_usd || 0} &nbsp;·&nbsp;
        📊 ${meta.input_tokens || 0} + ${meta.output_tokens || 0} токенів
      </div>
    </div>
  `;

  document.getElementById('aiFooter').innerHTML = `
    <button class="btn btn-secondary" onclick="closeAiModal()">Скасувати</button>
    <button class="btn btn-ai" onclick="applyAiData()">✅ Заповнити форму</button>
  `;
}

function applyAiData() {
  if (!aiData) return;
  const d = aiData;
  const c = d.contacts || {};

  // Основна інформація
  const setVal = (id, val) => { const el = document.getElementById(id); if (el && val != null && val !== '') el.value = val; };
  const setChk = (id, val) => { const el = document.getElementById(id); if (el && val != null) el.checked = !!val; };

  setVal('f_name',                  d.name);
  setVal('f_description',           d.description);
  setVal('f_location_text',         d.location_text);
  setVal('f_lat',                   d.lat);
  setVal('f_lng',                   d.lng);
  setVal('f_area_ha',               d.area_ha);
  setVal('f_max_depth_m',           d.max_depth_m);
  setVal('f_location_google_url',   d.location_google_url);
  setVal('f_location_waze_url',     d.location_waze_url);
  setVal('f_work_schedule_summary', d.work_schedule_summary);
  setVal('f_base_open_time',        d.base_open_time);
  setVal('f_base_close_time',       d.base_close_time);
  setVal('f_price_details_text',    d.price_details_text);
  setVal('f_catch_quota_text',      d.catch_quota_text);
  setVal('f_additional_services_text', d.additional_services_text);
  setVal('f_stocking_text',         d.stocking_text);
  setVal('f_lake_rules_text',       d.lake_rules_text);

  setChk('f_price_details_enabled',        d.price_details_enabled);
  setChk('f_contacts_enabled',             d.contacts_enabled);
  setChk('f_show_work_schedule',           d.work_schedule_summary != null);

  // Місто — підбираємо найближчий варіант із select
  if (d.city) {
    const sel = document.getElementById('f_city');
    if (sel) {
      const opts = Array.from(sel.options);
      const match = opts.find(o => o.value.toLowerCase().includes(d.city.toLowerCase()) || d.city.toLowerCase().includes(o.value.toLowerCase().replace(' область','')));
      if (match) sel.value = match.value;
    }
  }

  // Контакти
  const phones = [c.phone].flat().filter(Boolean);
  setVal('f_contacts_phone',     phones.join(', '));
  setVal('f_contacts_telegram',  c.telegram);
  setVal('f_contacts_instagram', c.instagram);
  setVal('f_contacts_viber',     c.viber);

  // Риба
  if (Array.isArray(d.fish_species) && d.fish_species.length > 0) {
    fishTags = [...d.fish_species];
    renderTags();
  }

  if (structured) {
    applyStructuredAiData(structured);
  }

  document.getElementById('aiModal')?.remove();
  aiData = null;

  toast('✅ Поля заповнено! Перевір і натисни «Зберегти»', 'success');

  // Скролимо вгору до форми
  document.getElementById('mainContent')?.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
